services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pdf
      POSTGRES_PASSWORD: pdf
      POSTGRES_DB: pdf_assistant
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-vector.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  pgdata:
