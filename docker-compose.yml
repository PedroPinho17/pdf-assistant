# Values come from the root .env (Docker Compose reads it automatically).
# Ports are bound to 127.0.0.1 so the databases are reachable only from this
# machine, never from other devices on the network.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pdf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pdf}
      POSTGRES_DB: ${POSTGRES_DB:-pdf_assistant}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-vector.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    ports:
      - "127.0.0.1:6379:6379"
volumes:
  pgdata:
